name: Release

# Builds the plugin when a version tag (e.g. 2.8.1) is pushed, attests the
# build so the community directory can verify where it came from, and
# publishes a GitHub release with main.js, manifest.json and styles.css.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Check the tag matches manifest.json
        run: |
          v=$(node -p "require('./manifest.json').version")
          test "$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match manifest version $v"; exit 1; }
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" --notes "Second Reader ${GITHUB_REF_NAME}"
